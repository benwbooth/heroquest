[package]
name = "heroquest"
version = "0.1.0"
edition = "2024"
description = "A scan-backed 3D dungeon-board engine with a computer game master"

[dependencies]
anyhow = "1.0"
bytemuck = { version = "1.25", features = ["derive"] }
env_logger = "0.11"
glam = { version = "0.33", features = ["bytemuck"] }
gltf = { version = "1.4", features = ["import"] }
image = { version = "0.25", default-features = false, features = ["jpeg", "png"] }
fontdue = "0.9.4"
log = "0.4"
pollster = "1.0"
rand = "0.9"
rand_chacha = "0.9"
rapier3d = { version = "0.35", features = ["enhanced-determinism"] }
sdl3 = { version = "0.18.4", features = ["raw-window-handle", "use-pkg-config"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2.0"
wgpu = "30.0"

[profile.release]
lto = "thin"
codegen-units = 1
